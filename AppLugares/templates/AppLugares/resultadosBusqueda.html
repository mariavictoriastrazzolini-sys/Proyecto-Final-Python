<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de busqueda</title>
</head>
<body>
    
    <p>Estamos buscando el lugar: {{nombre}}</p>
{% if lugares %}
    <ul>
        {% for lugar in lugares %}
        <li>{{lugar.nombre}}, {{lugar.ciudad}}</li>
        {% endfor %}
    </ul>
{% else %}
   <p>Sin Resultados</p> 
{% endif %}
</body>
</html>
